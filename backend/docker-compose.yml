services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - '3001:3001'
    environment:
      PORT: 3001
      NODE_ENV: ${NODE_ENV:-development}
      # Compatível com volumes locais criados pela configuração anterior.
      # Em produção, sobrescreva DATABASE_URL com um usuário dedicado.
      DATABASE_URL: ${DATABASE_URL:-mysql://root:password@mysql:3306/faztudo}
      JWT_SECRET: ${JWT_SECRET:?Configure JWT_SECRET in backend/.env with a random secret of at least 32 characters}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:5173}
      SEED_ON_START: ${SEED_ON_START:-false}
      SEED_PASSWORD: ${SEED_PASSWORD:-}
    depends_on:
      mysql:
        condition: service_healthy
    restart: unless-stopped
    command: ["/bin/sh", "/app/docker/entrypoint.sh"]

  frontend:
    build:
      context: ./docker
      dockerfile: frontend.Dockerfile
    ports:
      - '5173:5173'
    environment:
      VITE_API_BASE_URL: http://localhost:3001
      CHOKIDAR_USEPOLLING: 'true'
      CHOKIDAR_INTERVAL: 300
    volumes:
      - ..:/app
      - frontend-node-modules:/app/node_modules
    depends_on:
      app:
        condition: service_started
    restart: unless-stopped

  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-password}
      MYSQL_DATABASE: faztudo
      MYSQL_USER: faztudo
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-faztudo-local-app-2026}
    volumes:
      - mysql-data:/var/lib/mysql
    command: --default-authentication-plugin=mysql_native_password
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -ufaztudo -p$$MYSQL_PASSWORD"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  mysql-data:
  frontend-node-modules:
